<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner</title>
<meta name="description" content="Day-by-day itineraries for upcoming trips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script type="importmap">
  { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
</script>
<script type="module" src="js/app.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="md-typescale-body-medium">

<section id="trips-home">
  <header class="hero">
    <div class="hero-frame">
      <p class="eyebrow md-typescale-label-large">Trip Planner</p>
      <h1 class="md-typescale-display-small">Your Trips</h1>
    </div>
  </header>
  <main>
    <div class="list-wrap">
      <md-elevation></md-elevation>
      <md-list id="trips-list"></md-list>
    </div>
  </main>
</section>

<div id="trip-page" hidden>

<header class="hero">
  <div class="hero-frame">
    <md-icon-button id="back-to-trips" aria-label="All trips">
      <md-icon>arrow_back</md-icon>
    </md-icon-button>
    <p class="eyebrow md-typescale-label-large">Field Itinerary</p>
    <h1 class="md-typescale-display-small" id="trip-title"></h1>
    <ol class="route" aria-label="Route"></ol>
    <md-chip-set id="travelers-row"></md-chip-set>
    <md-chip-set>
      <md-suggestion-chip id="trip-date-chip">
        <md-icon slot="icon">calendar_month</md-icon>
      </md-suggestion-chip>
    </md-chip-set>
  </div>
</header>

<main>

<section id="overview">
  <p class="lead md-typescale-body-large" id="trip-summary"></p>

  <div class="legs-grid" id="legs-grid"></div>

  <div class="date-jump">
    <md-filled-tonal-button id="date-picker-open">
      Jump to a day
      <md-icon slot="icon">calendar_month</md-icon>
    </md-filled-tonal-button>
  </div>
</section>

<section id="day-list"></section>

</main>

</div>

<md-dialog id="leg-dialog">
  <div slot="headline" class="dialog-headline">
    <span id="leg-dialog-title"></span>
    <md-icon-button id="leg-dialog-close" aria-label="Close">
      <md-icon>close</md-icon>
    </md-icon-button>
  </div>
  <div slot="content" id="leg-dialog-body"></div>
</md-dialog>

<md-dialog id="date-picker-dialog">
  <div slot="headline" class="dialog-headline">
    <span>Jump to a day</span>
    <md-icon-button id="date-picker-close" aria-label="Close">
      <md-icon>close</md-icon>
    </md-icon-button>
  </div>
  <div slot="content" id="date-picker-body" class="date-picker"></div>
</md-dialog>

<detail-side-sheet></detail-side-sheet>

<footer class="md-typescale-body-small">
  Baseline itinerary, subject to change. Built from the trip-planning notes for reference on the go.
</footer>

</body>
</html>
